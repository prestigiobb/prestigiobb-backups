name: Backup diario de Prestigio

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Cliente de Postgres 17 (PGDG) y boto3
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pip install boto3 --quiet

      - name: Dump -Fc y CSV, cifrados con la clave pública
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          PG_BIN: /usr/lib/postgresql/17/bin/
        run: bash scripts/respaldar.sh cifrados backup-publica.asc

      - name: Subir a Backblaze B2 (bucket privado, carpeta por fecha)
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: python3 scripts/subir-b2.py cifrados

      - name: Borrar lo cifrado del runner
        if: always()
        run: rm -rf cifrados
